# Sixter nginx hardening — install to /etc/nginx/conf.d/sixter-hardening.conf
# (conf.d is included inside the http{} block). Reload: nginx -t && systemctl reload nginx
#
# Protects against slowloris (slow-drip) and L7 connection/request floods.

# return 429 (not 503) when limits are hit
limit_conn_status 429;
limit_req_status 429;

# global per-IP zones (per-domain confs also add their own limit_req)
limit_conn_zone $binary_remote_addr zone=sxt_conn:10m;
limit_req_zone  $binary_remote_addr zone=sxt_global:10m rate=40r/s;

# apply globally
limit_conn sxt_conn 60;
limit_req  zone=sxt_global burst=80 nodelay;

# slowloris: drop clients that dribble headers/body or stall
client_header_timeout 10s;
client_body_timeout   10s;
send_timeout          10s;
keepalive_timeout     30s 30s;
reset_timedout_connection on;

# request hygiene
client_max_body_size       50m;
large_client_header_buffers 4 8k;
# (server_tokens is set in the main nginx.conf — don't redeclare it here)

# ── real client IP behind Cloudflare ──
# Without this, every request logs Cloudflare's edge IP and the firewall would
# (wrongly) flag/ban Cloudflare. These trust ONLY Cloudflare ranges and read the
# true visitor IP from CF-Connecting-IP. Sites not behind Cloudflare are unaffected.
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
